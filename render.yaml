# Public, disposable testing environment. Not the production/Firebase deployment.
services:
  - type: web
    name: kujuk-preview
    runtime: node
    branch: arena/09023e9f-repo
    plan: free
    buildCommand: npm ci --include=dev && npm run build:hosted-preview
    startCommand: npm run start:hosted-preview
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
